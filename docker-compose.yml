services:
  img2vlm-app:
    build:
      context: ./img2vlm
      dockerfile: vlm_api_service/Dockerfile
    container_name: img2vlm-vlm-api
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      GIGACHAT_API_KEY: ${GIGACHAT_API_KEY:-}
      GIGACHAT_BASE_URL: ${GIGACHAT_BASE_URL:-https://gigachat.devices.sberbank.ru/api/v1}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2-Max}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_SCENE_PROMPT: ${GIGACHAT_SCENE_PROMPT:-Опиши сцену на изображении в 5-7 предложениях.}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_INPUT_TOPIC: ${KAFKA_INPUT_TOPIC:-imgs_to_process}
      KAFKA_OUTPUT_TOPIC: ${KAFKA_OUTPUT_TOPIC:-output}
      KAFKA_INPUT_CONSUMER_GROUP: ${KAFKA_INPUT_CONSUMER_GROUP:-vlm-image-processor}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-earliest}
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-3}
      SIMULATOR_DATASET_DIR: ${SIMULATOR_DATASET_DIR:-/app/sample_data/images}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-vlm-images}
      S3_REGION_NAME: ${S3_REGION_NAME:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
    depends_on:
      kafka:
        condition: service_started
      minio:
        condition: service_started

  image-simulator:
    build:
      context: ./img2vlm
      dockerfile: image_simulator_service/Dockerfile
    container_name: img2vlm-image-simulator
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_INPUT_TOPIC: ${KAFKA_INPUT_TOPIC:-imgs_to_process}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-earliest}
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-3}
      SIMULATOR_DATASET_DIR: ${SIMULATOR_DATASET_DIR:-/app/sample_data/images}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-vlm-images}
      S3_REGION_NAME: ${S3_REGION_NAME:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
    depends_on:
      kafka:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./img2vlm/sample_data:/app/sample_data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: storage-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  storage:
    image: storage-fastapi
    container_name: storage-fastapi
    build:
      context: .
      dockerfile: agent/agent.dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ES_HOST: ${ES_HOST:-http://elasticsearch:9200}
    depends_on:
      elasticsearch:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "storage.app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  agent:
    image: agent-cli
    container_name: agent-cli
    build:
      context: .
      dockerfile: agent/agent.dockerfile
    stdin_open: true
    tty: true
    environment:
      STORAGE_URL: ${STORAGE_URL:-http://storage:8000}
      GIGACHAT_API_KEY: ${GIGACHAT_API_KEY:-}
      GIGACHAT_BASE_URL: ${GIGACHAT_BASE_URL:-https://gigachat.devices.sberbank.ru/api/v1}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2-Max}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_CORP}
    depends_on:
      storage:
        condition: service_healthy
    command: ["python", "-m", "agent.app"]

  indexer:
    image: agent-cli
    container_name: indexer
    restart: unless-stopped
    environment:
      STORAGE_URL: ${STORAGE_URL:-http://storage:8000}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_OUTPUT_TOPIC: ${KAFKA_OUTPUT_TOPIC:-output}
      KAFKA_OUTPUT_CONSUMER_GROUP: ${KAFKA_OUTPUT_CONSUMER_GROUP:-indexer}
      GIGACHAT_API_KEY: ${GIGACHAT_API_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_CORP}
    depends_on:
      kafka:
        condition: service_started
      storage:
        condition: service_healthy
    command: ["python", "-m", "agent.indexer"]

  kafka:
    image: apache/kafka:latest
    container_name: kafka_vlm
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
  es_data: