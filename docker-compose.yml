services:
  app:
    build:
      context: .
      dockerfile: vlm_api_service/Dockerfile
    container_name: vlm-fastapi-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      GIGACHAT_API_KEY: ${GIGACHAT_API_KEY:-}
      GIGACHAT_BASE_URL: ${GIGACHAT_BASE_URL:-https://gigachat.devices.sberbank.ru/api/v1}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2-Max}
      GIGACHAT_PEOPLE_PROMPT: ${GIGACHAT_PEOPLE_PROMPT:-Верни строго JSON с количеством людей на изображении.}
      GIGACHAT_SCENE_PROMPT: ${GIGACHAT_SCENE_PROMPT:-Опиши сцену на изображении на русском языке в 5-7 предложениях.}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_INPUT_TOPIC: ${KAFKA_INPUT_TOPIC:-imgs_to_process}
      KAFKA_OUTPUT_TOPIC: ${KAFKA_OUTPUT_TOPIC:-output}
      KAFKA_INPUT_CONSUMER_GROUP: ${KAFKA_INPUT_CONSUMER_GROUP:-vlm-image-processor}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-earliest}
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-3}
      SIMULATOR_DATASET_DIR: ${SIMULATOR_DATASET_DIR:-/app/sample_data/images}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-vlm-images}
      S3_REGION_NAME: ${S3_REGION_NAME:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
    depends_on:
      - kafka
      - minio

  image-simulator:
    build:
      context: .
      dockerfile: image_simulator_service/Dockerfile
    container_name: image-simulator
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_INPUT_TOPIC: ${KAFKA_INPUT_TOPIC:-imgs_to_process}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-earliest}
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-3}
      SIMULATOR_DATASET_DIR: ${SIMULATOR_DATASET_DIR:-/app/sample_data/images}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-vlm-images}
      S3_REGION_NAME: ${S3_REGION_NAME:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
    depends_on:
      - kafka
      - minio
    volumes:
      - ./sample_data:/app/sample_data

  kafka:
    image: apache/kafka:latest
    container_name: kafka_vlm
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
